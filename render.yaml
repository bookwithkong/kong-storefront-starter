# Render Blueprint for this storefront.
#
# New -> Blueprint in the Render dashboard, point it at your repository,
# and approve. The environment variables are marked `sync: false` so
# Render prompts for them rather than baking placeholder values into the
# service — they differ per operator and one of them (SITE_ORIGIN) is not
# knowable until the service has a URL.
services:
  - type: web
    name: kong-storefront
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: KONG_ORGANIZATION_SLUG
        sync: false
      - key: NEXT_PUBLIC_KONG_ORGANIZATION_SLUG
        sync: false
      - key: NEXT_PUBLIC_KONG_TIMEZONE
        sync: false
      - key: NEXT_PUBLIC_KONG_CURRENCY
        sync: false
      # Set this to the service's own URL once Render has assigned one,
      # then declare the SAME value in Kong under Website -> Custom site.
      # A mismatch fails the booking rather than degrading quietly.
      - key: NEXT_PUBLIC_SITE_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_SITE_NAME
        sync: false
      - key: NEXT_PUBLIC_KONG_STOREFRONT_ORIGIN
        sync: false
